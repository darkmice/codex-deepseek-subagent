<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:" />
    <title>DeepSeek Subagent</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif);
        --surface: var(--color-surface, light-dark(#ffffff, #1c1c1e));
        --panel: var(--color-background-panel, light-dark(#ffffff, #232326));
        --text: var(--color-text-primary, light-dark(#1f2023, #f2f2f4));
        --muted: var(--color-text-secondary, light-dark(#6b7280, #a0a0a8));
        --border: var(--color-border, light-dark(#e3e3e6, #3a3a3e));
        --danger: var(--color-text-danger, light-dark(#b42318, #ff9086));
        --success: light-dark(#067647, #57d99b);
        --focus: color-mix(in oklab, var(--text) 45%, transparent);
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .shell { min-height: 100vh; padding: 34px 24px 44px; }
      main { width: min(100%, 720px); margin: 0 auto; }

      header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 26px; }
      h1 { margin: 0 0 5px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      .lead { margin: 0; max-width: 56ch; color: var(--muted); font-size: 13px; line-height: 1.5; }

      section { margin: 0 0 26px; }
      h2 { margin: 0 0 8px 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); }

      .card { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 340px);
        gap: 12px 20px;
        align-items: center;
        padding: 13px 16px;
      }
      .row + .row { border-top: 1px solid var(--border); }
      .copy { min-width: 0; }
      .copy strong { display: block; margin-bottom: 2px; font-size: 13px; font-weight: 500; }
      .copy span, .footnote { color: var(--muted); font-size: 12px; line-height: 1.45; }

      .control { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
      .control > input, .control > select { flex: 1 1 0; width: auto; }
      .control > button { flex: 0 0 auto; }

      input, select, button { font: inherit; }
      input, select {
        width: 100%;
        min-width: 0;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
      }
      select#language {
        width: auto;
        min-width: 0;
        height: 30px;
        padding: 0 6px;
        border-color: transparent;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
      }
      select#language:hover:not(:disabled) { background: color-mix(in oklab, var(--text) 6%, transparent); }
      button {
        min-height: 34px;
        height: 34px;
        padding: 0 12px;
        white-space: nowrap;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: color-mix(in oklab, var(--text) 6%, transparent);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: color-mix(in oklab, var(--text) 11%, transparent); }
      button:active:not(:disabled) { background: color-mix(in oklab, var(--text) 15%, transparent); }
      button.primary { background: color-mix(in oklab, var(--text) 10%, transparent); font-weight: 500; }
      button.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--text) 15%, transparent); }
      button.danger { color: var(--danger); }
      button.danger:hover:not(:disabled) { background: color-mix(in oklab, var(--danger) 12%, transparent); border-color: color-mix(in oklab, var(--danger) 38%, var(--border)); }
      input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
      button:disabled, input:disabled, select:disabled { opacity: .55; cursor: default; }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in oklab, var(--text) 4%, transparent);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .badge[data-state="configured"] { color: var(--success); border-color: color-mix(in oklab, var(--success) 32%, var(--border)); }
      .badge[data-state="missing"] { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 28%, var(--border)); }

      .status { min-height: 18px; margin: 16px 2px 0; color: var(--muted); font-size: 12px; }
      .status[data-tone="error"] { color: var(--danger); }
      .status[data-tone="success"] { color: var(--success); }
      .footnote { margin: 8px 2px 0; }

      @media (max-width: 640px) {
        .shell { padding: 24px 16px 32px; }
        header { flex-direction: column; align-items: flex-start; gap: 12px; }
        .row { grid-template-columns: 1fr; gap: 10px; align-items: stretch; }
        .control { justify-content: stretch; }
        .control > input, .control > select { flex: 1 1 100%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <main aria-busy="true">
        <header>
          <div>
            <h1>DeepSeek Subagent</h1>
            <p class="lead" data-i18n="lead"></p>
          </div>
          <select id="language" aria-label="Language">
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </header>

        <section>
          <h2 data-i18n="connection"></h2>
          <div class="card">
            <div class="row">
              <div class="copy"><strong>API key</strong><span data-i18n="keyStorage"></span></div>
              <div class="control"><span id="credentialBadge" class="badge"></span></div>
            </div>
            <div class="row">
              <div class="copy"><strong data-i18n="updateKey"></strong><span data-i18n="updateKeyHelp"></span></div>
              <div class="control">
                <input id="apiKey" type="password" inputmode="text" autocomplete="off" spellcheck="false" aria-label="DeepSeek API key" />
                <button id="saveKey" class="primary" type="button" data-i18n="save"></button>
              </div>
            </div>
            <div class="row">
              <div class="copy"><strong data-i18n="connectionTest"></strong><span data-i18n="connectionTestHelp"></span></div>
              <div class="control">
                <button id="testConnection" type="button" data-i18n="test"></button>
                <button id="deleteKey" class="danger" type="button" data-i18n="delete"></button>
              </div>
            </div>
          </div>
          <p class="footnote" data-i18n="secretNote"></p>
        </section>

        <section>
          <h2 data-i18n="nativeAgent"></h2>
          <div class="card">
            <div class="row">
              <div class="copy"><strong data-i18n="defaultModel"></strong><span data-i18n="modelHelp"></span></div>
              <div class="control">
                <select id="model" aria-label="DeepSeek model"></select>
                <button id="refreshModels" type="button" data-i18n="refresh"></button>
                <button id="saveModel" class="primary" type="button" data-i18n="save"></button>
              </div>
            </div>
            <div class="row">
              <div class="copy"><strong data-i18n="nativeStatus"></strong><span data-i18n="nativeHelp"></span></div>
              <div class="control"><span id="nativeBadge" class="badge"></span></div>
            </div>
          </div>
          <p class="footnote" data-i18n="restartNote"></p>
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </main>
    </div>
    <script>
      (() => {
        "use strict";
        const PROTOCOL_VERSION = "2026-01-26";
        const TOOL = {
          read: "deepseek_settings",
          save: "deepseek_settings_save",
          models: "deepseek_models_list",
          setKey: "deepseek_credential_set",
          deleteKey: "deepseek_credential_delete",
          test: "deepseek_connection_test",
        };
        const text = {
          en: {
            lead: "Configure DeepSeek for native Codex child tasks. A local loopback router preserves the parent provider and routes requests whose model matches the selected DeepSeek model.",
            connection: "Connection", keyStorage: "Stored in this user's platform-specific settings file.", configured: "Configured ••••••••", missing: "Not configured",
            updateKey: "Update API key", updateKeyHelp: "The input is cleared after the key is saved to the private local settings file.", save: "Save",
            connectionTest: "Connection test", connectionTestHelp: "Refreshes models and tests the selected Responses model with a tiny request.", test: "Test connection", delete: "Delete key",
            secretNote: "The key is stored only in the private local settings file and is sent as authorization only to the configured DeepSeek API. Parent authorization is never forwarded to DeepSeek.", nativeAgent: "Native child task", defaultModel: "Default model",
            modelHelp: "Shows DeepSeek GET /v1/models plus deepseek-flash; the selected model is verified through Responses when saved.", nativeStatus: "Native routing", nativeHelp: "Requires [features.multi_agent_v2] enabled = true in Codex config, then installs a user-scoped loopback provider router on macOS, Windows, or Linux. hide_spawn_agent_metadata = false is optional and only controls metadata visibility.", nativeReady: "Ready", nativeMissing: "Setup required", restartNote: "A delegated request may send its task message, model context, tool definitions/results, and attachments to DeepSeek. Saving or updating a model requires Save model again, then a new Codex task. Before uninstalling, delete the key here or run the independent cleanup command documented in the README. Deleting the key disables DeepSeek immediately, restores new tasks, and keeps parent pass-through alive for up to 10 minutes for already-open tasks.", refresh: "Refresh", configureFirst: "Configure an API key first", noModels: "No models returned",
            loading: "Loading settings…", ready: "Settings ready.", savingKey: "Saving API key…", keySaved: "API key saved and models refreshed.",
            deleting: "Deleting API key…", deleted: "API key deleted.", refreshing: "Refreshing model list…", refreshed: "Model list refreshed.",
            testing: "Testing DeepSeek connection…", tested: "Connection succeeded.", savingModel: "Saving default model…", modelSaved: "Model saved. Start a new Codex task.",
            invalidKey: "Enter a valid DeepSeek API key.", selectModel: "Select an available model.", timeout: "Settings service timed out.", failed: "Operation failed.",
            errNotConfigured: "Save an API key and select a model first.", errModelUnavailable: "The selected model is unavailable. Refresh the model list.",
            errSettingsConflict: "Settings changed in another window. Reload and try again.", errSettingsInvalid: "The local DeepSeek settings file is damaged. Follow the README recovery steps for settings.json, then reopen Settings.", errUpstreamTimeout: "DeepSeek did not respond within 30 seconds.",
            errNetwork: "Unable to reach DeepSeek. Check the network and API endpoint.", errHttp: "DeepSeek rejected the request (HTTP {status}).",
            errInvalidResponse: "DeepSeek returned an invalid response.", errNativeNotReady: "Native routing is not ready. Save the model again, then start a new Codex task.",
            errRouter: "The local DeepSeek router is unavailable. Save the model again.", errNativeIntegration: "Codex native routing could not be updated safely.",
            errMultiAgent: "Enable Codex Multi-Agent v2, then save the model again.", errProviderAuth: "The active Codex provider is not ChatGPT-authenticated. Restore a supported parent provider first.",
            errProviderUnsupported: "The active Codex provider configuration cannot be routed safely.", errPlatformUnsupported: "Native DeepSeek routing requires macOS, Windows, or Linux.",
            errOwnership: "A routing file, service, or process is owned by another program. The plugin left it unchanged.",
          },
          zh: {
            lead: "为 Codex 原生子任务配置 DeepSeek。本机 loopback 路由保留父任务 provider，并把请求模型与所选 DeepSeek 模型一致的请求转发给 DeepSeek。",
            connection: "连接", keyStorage: "保存在当前用户的平台专用设置文件中。", configured: "已配置 ••••••••", missing: "未配置",
            updateKey: "更新 API key", updateKeyHelp: "Key 会保存到私有本机设置文件，保存后仅清空输入框。", save: "保存",
            connectionTest: "连接测试", connectionTestHelp: "刷新模型，并用极小请求测试已选 Responses 模型。", test: "测试连接", delete: "删除 Key",
            secretNote: "Key 仅持久化在私有本机设置文件，并只作为认证发送给所配置的 DeepSeek API；父任务授权绝不会转发给 DeepSeek。", nativeAgent: "原生子任务", defaultModel: "默认模型",
            modelHelp: "显示 DeepSeek GET /v1/models 返回的模型及 deepseek-flash；保存时会通过 Responses 验证所选模型。", nativeStatus: "原生路由", nativeHelp: "要求 Codex 配置 [features.multi_agent_v2] enabled = true，然后在 macOS、Windows 或 Linux 上安装用户级本机 provider 路由。hide_spawn_agent_metadata = false 仅控制元数据是否可见，可选。", nativeReady: "已就绪", nativeMissing: "需要设置", restartNote: "委派请求可能把任务消息、模型上下文、工具定义/结果及附件发送给 DeepSeek。安装或更新后必须再次保存模型，再新建 Codex 任务。卸载插件前必须在此删除 Key，或执行 README 中的独立清理命令。删除 Key 会立即禁用 DeepSeek、为新任务恢复 provider，并为已打开任务保留最长 10 分钟的父请求透传。", refresh: "刷新", configureFirst: "请先配置 API key", noModels: "接口未返回模型",
            loading: "正在加载设置…", ready: "设置已就绪。", savingKey: "正在保存 API key…", keySaved: "API key 已保存，模型列表已刷新。",
            deleting: "正在删除 API key…", deleted: "API key 已删除。", refreshing: "正在刷新模型列表…", refreshed: "模型列表已刷新。",
            testing: "正在测试 DeepSeek 连接…", tested: "连接成功。", savingModel: "正在保存默认模型…", modelSaved: "模型已保存，请新建 Codex 任务。",
            invalidKey: "请输入有效的 DeepSeek API key。", selectModel: "请选择可用模型。", timeout: "设置服务响应超时。", failed: "操作失败。",
            errNotConfigured: "请先保存 API key 并选择模型。", errModelUnavailable: "所选模型不可用，请刷新模型列表。",
            errSettingsConflict: "设置已被其他窗口修改，请重新加载后再试。", errSettingsInvalid: "本机 DeepSeek 设置文件已损坏，请按 README 的 settings.json 恢复步骤处理后重新打开设置页。", errUpstreamTimeout: "DeepSeek 在 30 秒内没有响应。",
            errNetwork: "无法连接 DeepSeek，请检查网络和 API 地址。", errHttp: "DeepSeek 拒绝了请求（HTTP {status}）。",
            errInvalidResponse: "DeepSeek 返回了无效响应。", errNativeNotReady: "原生路由尚未就绪，请重新保存模型并新建 Codex 任务。",
            errRouter: "本机 DeepSeek 路由不可用，请重新保存模型。", errNativeIntegration: "无法安全更新 Codex 原生路由。",
            errMultiAgent: "请启用 Codex Multi-Agent v2，然后重新保存模型。", errProviderAuth: "当前 Codex provider 不是 ChatGPT 认证的 provider，请先恢复受支持的父 provider。",
            errProviderUnsupported: "当前 Codex provider 配置无法被安全路由。", errPlatformUnsupported: "DeepSeek 原生路由需要 macOS、Windows 或 Linux。",
            errOwnership: "路由文件、服务或进程属于其他程序，插件已保持其不变。",
          },
        };
        const pending = new Map();
        let nextId = 1;
        let bridgeReady = null;
        let snapshot = null;
        let modelList = [];
        let busy = false;
        let manualLanguage = false;
        let currentStatusKey = "";
        const LONG_TOOL_TIMEOUT_MS = 115000;
        const main = document.querySelector("main");
        const languageInput = document.getElementById("language");
        const keyInput = document.getElementById("apiKey");
        const modelInput = document.getElementById("model");
        const badge = document.getElementById("credentialBadge");
        const nativeBadge = document.getElementById("nativeBadge");
        const status = document.getElementById("status");
        const buttons = [...document.querySelectorAll("button")];

        function normalizedLanguage(value) { return String(value || "").toLowerCase().startsWith("zh") ? "zh" : "en"; }
        let language = normalizedLanguage(navigator.language);
        function t(key) { return text[language][key] || text.en[key] || key; }
        function applyLanguage(next, manual = false) {
          language = next === "zh" ? "zh" : "en";
          manualLanguage ||= manual;
          document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
          languageInput.value = language;
          document.querySelectorAll("[data-i18n]").forEach((element) => { element.textContent = t(element.dataset.i18n); });
          render(snapshot);
          renderModels(modelList, modelInput.value || snapshot?.model || "");
          if (currentStatusKey) status.textContent = t(currentStatusKey);
        }

        function setBusy(next) {
          busy = next;
          main.setAttribute("aria-busy", String(next));
          buttons.forEach((button) => { button.disabled = next; });
          keyInput.disabled = next;
          modelInput.disabled = next || modelList.length === 0;
          languageInput.disabled = false;
          if (!next && snapshot) render(snapshot);
        }
        function setStatus(message, tone = "", translationKey = "") { currentStatusKey = translationKey; status.textContent = message; status.dataset.tone = tone; }
        function rpcNotify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*"); }
        function rpcRequest(method, params, timeoutMs = 15000) {
          const id = nextId++;
          return new Promise((resolve, reject) => {
            const timeout = window.setTimeout(() => { pending.delete(id); const error = new Error(t("timeout")); error.code = "BRIDGE_TIMEOUT"; reject(error); }, timeoutMs);
            pending.set(id, { resolve, reject, timeout });
            window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          });
        }
        function applyHostContext(context) {
          if (!context || typeof context !== "object") return;
          if (!manualLanguage && context.locale) applyLanguage(normalizedLanguage(context.locale));
          if (["light", "dark"].includes(context.theme)) document.documentElement.style.colorScheme = context.theme;
          const variables = context.styles?.variables;
          if (!variables || typeof variables !== "object") return;
          for (const [name, value] of Object.entries(variables)) {
            if (/^--(?:color|font|text|radius)-[a-z0-9-]+$/i.test(name) && typeof value === "string" && value.length < 2048) document.documentElement.style.setProperty(name, value);
          }
        }
        async function initializeBridge() {
          if (!bridgeReady) bridgeReady = (async () => {
            const result = await rpcRequest("ui/initialize", {
              appInfo: { name: "DeepSeek Subagent", version: "0.5.0+codex.20260915113133" },
              appCapabilities: {},
              protocolVersion: PROTOCOL_VERSION,
            }, 8000);
            applyHostContext(result?.hostContext);
            rpcNotify("ui/notifications/initialized", {});
            return result;
          })();
          return bridgeReady;
        }
        async function callTool(name, args = {}, timeoutMs = 15000) {
          await initializeBridge();
          return rpcRequest("tools/call", { name, arguments: args }, timeoutMs);
        }
        function structured(value) {
          const candidates = [value?.structuredContent, value?.result?.structuredContent, value?.toolOutput?.structuredContent, value];
          return candidates.find((candidate) => candidate && typeof candidate === "object") || null;
        }
        function failure(value) {
          const failed = [value, value?.result, value?.toolOutput].find((candidate) => candidate?.isError === true);
          if (!failed) return null;
          const details = failed._meta?.deepseekSubagentError;
          const error = new Error(failed.content?.find((item) => item?.type === "text")?.text || t("failed"));
          error.code = details?.code;
          error.params = details?.params;
          return error;
        }
        function localizedError(error) {
          const keys = {
            INVALID_API_KEY: "invalidKey", NOT_CONFIGURED: "errNotConfigured", MODEL_UNAVAILABLE: "errModelUnavailable",
            SETTINGS_CONFLICT: "errSettingsConflict", SETTINGS_INVALID: "errSettingsInvalid", UPSTREAM_TIMEOUT: "errUpstreamTimeout", NETWORK_UNREACHABLE: "errNetwork",
            UPSTREAM_HTTP_ERROR: "errHttp", UPSTREAM_INVALID_RESPONSE: "errInvalidResponse", NATIVE_NOT_READY: "errNativeNotReady",
            ROUTER_UNAVAILABLE: "errRouter", NATIVE_INTEGRATION_FAILED: "errNativeIntegration", MULTI_AGENT_DISABLED: "errMultiAgent",
            PROVIDER_NOT_AUTHENTICATED: "errProviderAuth", PROVIDER_UNSUPPORTED: "errProviderUnsupported",
            NATIVE_PLATFORM_UNSUPPORTED: "errPlatformUnsupported", OWNERSHIP_CONFLICT: "errOwnership", BRIDGE_TIMEOUT: "timeout",
          };
          const template = t(keys[error?.code] || "failed");
          return template.replace("{status}", String(error?.params?.status || "?"));
        }
        function render(next) {
          if (!next) return;
          snapshot = next;
          badge.dataset.state = next.credentialConfigured ? "configured" : "missing";
          badge.textContent = next.credentialConfigured ? t("configured") : t("missing");
          nativeBadge.dataset.state = next.nativeReady ? "configured" : "missing";
          nativeBadge.textContent = next.nativeReady ? t("nativeReady") : t("nativeMissing");
          if (!busy) {
            document.getElementById("deleteKey").disabled = !next.credentialConfigured;
            document.getElementById("testConnection").disabled = !next.credentialConfigured;
            document.getElementById("refreshModels").disabled = !next.credentialConfigured;
            document.getElementById("saveModel").disabled = !next.credentialConfigured || modelList.length === 0;
          }
        }
        function renderModels(models, selected) {
          modelList = Array.isArray(models) ? models : [];
          modelInput.replaceChildren();
          if (!modelList.length) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = snapshot?.credentialConfigured ? t("noModels") : t("configureFirst");
            modelInput.appendChild(option);
          } else {
            for (const model of modelList) {
              const option = document.createElement("option");
              option.value = model.id;
              option.textContent = model.id;
              modelInput.appendChild(option);
            }
            modelInput.value = modelList.some((model) => model.id === selected) ? selected : modelList[0].id;
          }
          modelInput.disabled = busy || modelList.length === 0;
          if (snapshot) render(snapshot);
        }
        async function refreshModels(force = true) {
          const result = await callTool(TOOL.models, { force }, LONG_TOOL_TIMEOUT_MS);
          const toolFailure = failure(result);
          if (toolFailure) throw toolFailure;
          const next = structured(result);
          if (!next || !Array.isArray(next.models)) throw new Error(t("failed"));
          renderModels(next.models, next.selectedModel || snapshot?.model || "");
          return next;
        }
        async function action(progressKey, successKey, operation) {
          setBusy(true);
          setStatus(t(progressKey), "", progressKey);
          try {
            const result = await operation();
            const toolFailure = failure(result);
            if (toolFailure) throw toolFailure;
            const next = structured(result);
            if (next && typeof next.credentialConfigured === "boolean") render(next);
            setStatus(t(successKey), "success", successKey);
          } catch (error) {
            if (error?.code === "BRIDGE_TIMEOUT") {
              try {
                const reconciled = await callTool(TOOL.read, {}, 15000);
                const reconciledFailure = failure(reconciled);
                if (!reconciledFailure) render(structured(reconciled));
              } catch {}
            }
            setStatus(localizedError(error), "error");
          }
          finally { setBusy(false); }
        }
        async function load() {
          setBusy(true);
          setStatus(t("loading"), "", "loading");
          try {
            const result = await callTool(TOOL.read);
            const toolFailure = failure(result);
            if (toolFailure) throw toolFailure;
            const next = structured(result);
            if (!next || typeof next.credentialConfigured !== "boolean" || typeof next.model !== "string") throw new Error(t("failed"));
            render(next);
            if (next.credentialConfigured) await refreshModels(false);
            else renderModels([], "");
            setStatus(t("ready"), "success", "ready");
          } catch (error) { setStatus(localizedError(error), "error"); }
          finally { setBusy(false); }
        }

        languageInput.addEventListener("change", () => applyLanguage(languageInput.value, true));
        document.getElementById("saveKey").addEventListener("click", () => {
          const apiKey = keyInput.value.trim();
          if (apiKey.length < 8) { setStatus(t("invalidKey"), "error", "invalidKey"); return; }
          void action("savingKey", "keySaved", async () => {
            const saved = await callTool(TOOL.setKey, { expectedRevision: snapshot?.revision || 0, apiKey }, 30000);
            const toolFailure = failure(saved);
            if (toolFailure) throw toolFailure;
            render(structured(saved));
            keyInput.value = "";
            await refreshModels(true);
            return saved;
          });
        });
        document.getElementById("deleteKey").addEventListener("click", () => void action("deleting", "deleted", async () => {
          const result = await callTool(TOOL.deleteKey, { expectedRevision: snapshot?.revision || 0 });
          const failed = failure(result); if (failed) throw failed;
          renderModels([], "");
          return result;
        }));
        document.getElementById("refreshModels").addEventListener("click", () => void action("refreshing", "refreshed", () => refreshModels(true)));
        document.getElementById("testConnection").addEventListener("click", () => {
          if (!modelInput.value) { setStatus(t("selectModel"), "error", "selectModel"); return; }
          void action("testing", "tested", () => callTool(TOOL.test, { model: modelInput.value }, LONG_TOOL_TIMEOUT_MS));
        });
        document.getElementById("saveModel").addEventListener("click", () => {
          if (!modelInput.value) { setStatus(t("selectModel"), "error", "selectModel"); return; }
          void action("savingModel", "modelSaved", () => callTool(TOOL.save, { expectedRevision: snapshot?.revision || 0, model: modelInput.value }, LONG_TOOL_TIMEOUT_MS));
        });
        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (message.method === "ui/notifications/host-context-changed") { applyHostContext(message.params); return; }
          if (!Object.prototype.hasOwnProperty.call(message, "id")) return;
          const request = pending.get(message.id);
          if (!request) return;
          pending.delete(message.id);
          window.clearTimeout(request.timeout);
          if (message.error) { const error = new Error(message.error.message || t("failed")); error.code = message.error.code; request.reject(error); }
          else request.resolve(message.result);
        });
        applyLanguage(language);
        void load();
      })();
    </script>
  </body>
</html>
