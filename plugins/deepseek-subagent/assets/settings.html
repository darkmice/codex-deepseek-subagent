<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:" />
    <title>DeepSeek Subagent</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif);
        --surface: var(--color-surface, light-dark(#ffffff, #1c1c1e));
        --panel: var(--color-background-panel, light-dark(#ffffff, #232326));
        --text: var(--color-text-primary, light-dark(#1f2023, #f2f2f4));
        --muted: var(--color-text-secondary, light-dark(#6b7280, #a0a0a8));
        --border: var(--color-border, light-dark(#e3e3e6, #3a3a3e));
        --danger: var(--color-text-danger, light-dark(#b42318, #ff9086));
        --success: light-dark(#067647, #57d99b);
        --focus: color-mix(in oklab, var(--text) 45%, transparent);
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .shell { min-height: 100vh; padding: 34px 24px 44px; }
      main { width: min(100%, 720px); margin: 0 auto; }

      header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 26px; }
      h1 { margin: 0 0 5px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      .lead { margin: 0; max-width: 56ch; color: var(--muted); font-size: 13px; line-height: 1.5; }

      section { margin: 0 0 26px; }
      h2 { margin: 0 0 8px 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); }

      .card { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 340px);
        gap: 12px 20px;
        align-items: center;
        padding: 13px 16px;
      }
      .row + .row { border-top: 1px solid var(--border); }
      .row.stacked { grid-template-columns: 1fr; align-items: stretch; }
      .row.stacked .copy span { display: block; max-width: 62ch; }
      .copy { min-width: 0; }
      .copy strong { display: block; margin-bottom: 2px; font-size: 13px; font-weight: 500; }
      .copy span, .footnote { color: var(--muted); font-size: 12px; line-height: 1.45; }

      .control { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
      .control > input, .control > select { flex: 1 1 0; width: auto; }
      .control > button { flex: 0 0 auto; }
      .connection-form > input { flex-basis: 100%; }

      input, select, button { font: inherit; }
      input, select {
        width: 100%;
        min-width: 0;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
      }
      select#language {
        width: auto;
        min-width: 0;
        height: 30px;
        padding: 0 6px;
        border-color: transparent;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
      }
      select#language:hover:not(:disabled) { background: color-mix(in oklab, var(--text) 6%, transparent); }
      button {
        min-height: 34px;
        height: 34px;
        padding: 0 12px;
        white-space: nowrap;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: color-mix(in oklab, var(--text) 6%, transparent);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: color-mix(in oklab, var(--text) 11%, transparent); }
      button:active:not(:disabled) { background: color-mix(in oklab, var(--text) 15%, transparent); }
      button.primary { background: color-mix(in oklab, var(--text) 10%, transparent); font-weight: 500; }
      button.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--text) 15%, transparent); }
      button.danger { color: var(--danger); }
      button.danger:hover:not(:disabled) { background: color-mix(in oklab, var(--danger) 12%, transparent); border-color: color-mix(in oklab, var(--danger) 38%, var(--border)); }
      input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
      button:disabled, input:disabled, select:disabled { opacity: .55; cursor: default; }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in oklab, var(--text) 4%, transparent);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .badge[data-state="configured"] { color: var(--success); border-color: color-mix(in oklab, var(--success) 32%, var(--border)); }
      .badge[data-state="missing"] { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 28%, var(--border)); }

      .status { min-height: 18px; margin: 16px 2px 0; color: var(--muted); font-size: 12px; }
      .status[data-tone="error"] { color: var(--danger); }
      .status[data-tone="success"] { color: var(--success); }
      .footnote { margin: 8px 2px 0; }
      .credential-list { display: grid; gap: 8px; width: 100%; }
      .credential-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px 16px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: color-mix(in oklab, var(--text) 2%, transparent);
      }
      .credential-fields { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(120px, .8fr) minmax(240px, 2fr); gap: 10px; min-width: 0; }
      .credential-field { display: grid; gap: 5px; min-width: 0; }
      .credential-field > span { color: var(--muted); font-size: 11px; font-weight: 500; line-height: 1.2; }
      .credential-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
      .credential-actions button { min-width: 34px; padding: 0 8px; }
      .credential-state { min-width: 72px; justify-content: center; }
      .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
      .toggle input { width: 16px; height: 16px; margin: 0; }

      @media (max-width: 640px) {
        .shell { padding: 24px 16px 32px; }
        header { flex-direction: column; align-items: flex-start; gap: 12px; }
        .row { grid-template-columns: 1fr; gap: 10px; align-items: stretch; }
        .control { justify-content: stretch; }
        .control > input, .control > select { flex: 1 1 100%; }
        .credential-item { grid-template-columns: 1fr auto; }
        .credential-fields { grid-column: 1 / -1; grid-template-columns: 1fr; }
        .credential-actions { grid-column: 1 / -1; justify-content: flex-end; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <main aria-busy="true">
        <header>
          <div>
            <h1>DeepSeek Subagent</h1>
            <p class="lead" data-i18n="lead"></p>
          </div>
          <select id="language" data-i18n-aria-label="languageAria" aria-label="Language">
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </header>

        <section>
          <h2 data-i18n="connection"></h2>
          <div class="card">
            <div class="row">
              <div class="copy"><strong data-i18n="apiKeys"></strong><span data-i18n="keyStorage"></span></div>
              <div class="control"><span id="credentialBadge" class="badge"></span></div>
            </div>
            <div class="row stacked">
              <div class="copy"><strong data-i18n="credentialPool"></strong><span data-i18n="credentialPoolHelp"></span></div>
              <div id="credentialList" class="credential-list"></div>
            </div>
            <div class="row">
              <div class="copy"><strong data-i18n="addKey"></strong><span data-i18n="addKeyHelp"></span></div>
              <div class="control connection-form">
                <input id="keyLabel" type="text" autocomplete="off" spellcheck="false" data-i18n-aria-label="newKeyLabelAria" data-i18n-placeholder="labelPlaceholder" aria-label="DeepSeek connection label" placeholder="Label" />
                <input id="newBaseUrl" type="url" inputmode="url" autocomplete="url" spellcheck="false" value="https://api.deepseek.com/v1/" data-i18n-aria-label="newBaseUrlAria" data-i18n-placeholder="baseUrlPlaceholder" aria-label="DeepSeek API base URL for this connection" placeholder="Base URL" />
                <input id="apiKey" type="password" inputmode="text" autocomplete="off" spellcheck="false" data-i18n-aria-label="newKeyAria" data-i18n-placeholder="apiKeyPlaceholder" aria-label="DeepSeek API key" placeholder="API key" />
                <button id="addKey" class="primary" type="button" data-i18n="add"></button>
              </div>
            </div>
            <div class="row">
              <div class="copy"><strong data-i18n="connectionTest"></strong><span data-i18n="connectionTestHelp"></span></div>
              <div class="control">
                <button id="testConnection" type="button" data-i18n="test"></button>
                <button id="deleteKeys" class="danger" type="button" data-i18n="deleteAll"></button>
              </div>
            </div>
          </div>
          <p class="footnote" data-i18n="secretNote"></p>
        </section>

        <section>
          <h2 data-i18n="nativeAgent"></h2>
          <div class="card">
            <div class="row">
              <div class="copy"><strong data-i18n="defaultModel"></strong><span data-i18n="modelHelp"></span></div>
              <div class="control">
                <select id="model" data-i18n-aria-label="modelAria" aria-label="DeepSeek model"></select>
                <button id="refreshModels" type="button" data-i18n="refresh"></button>
                <button id="saveModel" class="primary" type="button" data-i18n="save"></button>
              </div>
            </div>
            <div class="row">
              <div class="copy"><strong data-i18n="nativeStatus"></strong><span data-i18n="nativeHelp"></span></div>
              <div class="control"><span id="nativeBadge" class="badge"></span></div>
            </div>
          </div>
          <p class="footnote" data-i18n="restartNote"></p>
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </main>
    </div>

          manualLanguage ||= manual;
          document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

          busy = next;
          main.setAttribute("aria-busy", String(next));
          document.querySelectorAll("button, input").forEach((control) => { control.disabled = next; });
          modelInput.disabled = next || modelList.length === 0;
          languageInput.disabled = false;
          if (!next && snapshot) render(snapshot);
        }
        function setStatus(message, tone = "", translationKey = "") { currentStatusKey = translationKey; status.textContent = message; status.dataset.tone = tone; }
        function rpcNotify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*"); }
        function rpcRequest(method, params, timeoutMs = 15000) {
          const id = nextId++;
          return new Promise((resolve, reject) => {
            const timeout = window.setTimeout(() => { pending.delete(id); const error = new Error(t("timeout")); error.code = "BRIDGE_TIMEOUT"; reject(error); }, timeoutMs);
            pending.set(id, { resolve, reject, timeout });
            window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          });
        }
        function applyHostContext(context) {
          if (!context || typeof context !== "object") return;
          if (!manualLanguage && context.locale) applyLanguage(normalizedLanguage(context.locale));
          if (["light", "dark"].includes(context.theme)) document.documentElement.style.colorScheme = context.theme;
          const variables = context.styles?.variables;
          if (!variables || typeof variables !== "object") return;
          for (const [name, value] of Object.entries(variables)) {
            if (/^--(?:color|font|text|radius)-[a-z0-9-]+$/i.test(name) && typeof value === "string" && value.length < 2048) document.documentElement.style.setProperty(name, value);
          }
        }
        async function initializeBridge() {
          if (!bridgeReady) bridgeReady = (async () => {
            const result = await rpcRequest("ui/initialize", {
              appInfo: { name: "DeepSeek Subagent", version: "0.7.0+codex.20260917054058" },
              appCapabilities: {},
              protocolVersion: PROTOCOL_VERSION,
            }, 8000);
            applyHostContext(result?.hostContext);
            rpcNotify("ui/notifications/initialized", {});
            return result;
          })();
          return bridgeReady;
        }
        async function callTool(name, args = {}, timeoutMs = 15000) {
          await initializeBridge();
          return rpcRequest("tools/call", { name, arguments: args }, timeoutMs);
        }
        function structured(value) {
          const candidates = [value?.structuredContent, value?.result?.structuredContent, value?.toolOutput?.structuredContent, value];
          return candidates.find((candidate) => candidate && typeof candidate === "object") || null;
        }
        function failure(value) {
          const failed = [value, value?.result, value?.toolOutput].find((candidate) => candidate?.isError === true);
          if (!failed) return null;
          const details = failed._meta?.deepseekSubagentError;
          const error = new Error(failed.content?.find((item) => item?.type === "text")?.text || t("failed"));
          error.code = details?.code;
          error.params = details?.params;
          return error;
        }
        function localizedError(error) {
          const keys = {
            INVALID_API_KEY: "invalidKey", INVALID_BASE_URL: "invalidBaseUrl", NOT_CONFIGURED: "errNotConfigured", MODEL_UNAVAILABLE: "errModelUnavailable",
            SETTINGS_CONFLICT: "errSettingsConflict", SETTINGS_INVALID: "errSettingsInvalid", UPSTREAM_TIMEOUT: "errUpstreamTimeout", NETWORK_UNREACHABLE: "errNetwork",
            UPSTREAM_HTTP_ERROR: "errHttp", UPSTREAM_INVALID_RESPONSE: "errInvalidResponse", NATIVE_NOT_READY: "errNativeNotReady",
            ROUTER_UNAVAILABLE: "errRouter", NATIVE_INTEGRATION_FAILED: "errNativeIntegration", MULTI_AGENT_DISABLED: "errMultiAgent",
            PROVIDER_NOT_AUTHENTICATED: "errProviderAuth", PROVIDER_UNSUPPORTED: "errProviderUnsupported",
            NATIVE_PLATFORM_UNSUPPORTED: "errPlatformUnsupported", OWNERSHIP_CONFLICT: "errOwnership", BRIDGE_TIMEOUT: "timeout",
          };
          const template = t(keys[error?.code] || "failed");
          return template.replace("{status}", String(error?.params?.status || "?"));
        }
        function renderCredentials(credentials) {
          credentialList.replaceChildren();
          if (!Array.isArray(credentials) || credentials.length === 0) {
            const empty = document.createElement("span");
            empty.className = "footnote";
            empty.textContent = t("emptyPool");
            credentialList.appendChild(empty);
            return;
          }
          credentials.forEach((credential, index) => {
            const item = document.createElement("div");
            item.className = "credential-item";
            const fields = document.createElement("div");
            fields.className = "credential-fields";
            const label = document.createElement("input");
            label.type = "text";
            label.value = credential.label;
            label.maxLength = 128;
            label.disabled = busy;
            label.setAttribute("aria-label", `${credential.label}: ${t("labelAria")}`);
            label.addEventListener("change", () => {
              const value = label.value.trim();
              if (!value || value === credential.label) { label.value = credential.label; return; }
              void updateCredential(credential.id, value, credential.baseUrl, credential.enabled, false);
            });
            const labelField = document.createElement("label");
            labelField.className = "credential-field";
            const labelCaption = document.createElement("span");
            labelCaption.textContent = t("connectionLabel");
            labelField.append(labelCaption, label);
            const baseUrl = document.createElement("input");
            baseUrl.type = "url";
            baseUrl.inputMode = "url";
            baseUrl.autocomplete = "url";
            baseUrl.spellcheck = false;
            baseUrl.value = credential.baseUrl;
            baseUrl.disabled = busy;
            baseUrl.setAttribute("aria-label", `${credential.label}: ${t("baseUrlAria")}`);
            baseUrl.addEventListener("change", () => {
              const value = baseUrl.value.trim();
              if (!validBaseUrl(value)) { baseUrl.value = credential.baseUrl; setStatus(t("invalidBaseUrl"), "error", "invalidBaseUrl"); return; }
              if (value === credential.baseUrl) return;
              void updateCredential(credential.id, credential.label, value, credential.enabled, credential.enabled);
            });
            const baseUrlField = document.createElement("label");
            baseUrlField.className = "credential-field";
            const baseUrlCaption = document.createElement("span");
            baseUrlCaption.textContent = t("baseUrl");
            baseUrlField.append(baseUrlCaption, baseUrl);
            fields.append(labelField, baseUrlField);
            const enabled = document.createElement("label");
            enabled.className = "toggle";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = credential.enabled;
            checkbox.disabled = busy;
            checkbox.setAttribute("aria-label", `${credential.label}: ${t("enabled")}`);
            checkbox.addEventListener("change", () => void updateCredential(
              credential.id, credential.label, credential.baseUrl, checkbox.checked, !credential.enabled && checkbox.checked,
            ));
            const enabledText = document.createElement("span");
            enabledText.textContent = t("enabled");
            enabled.append(checkbox, enabledText);
            const actions = document.createElement("div");
            actions.className = "credential-actions";
            const state = document.createElement("span");
            state.className = "badge credential-state";
            state.dataset.state = credential.status === "ready" ? "configured" : credential.status === "disabled" ? "" : "missing";
            state.textContent = t({ ready: "statusReady", disabled: "statusDisabled", invalid: "statusInvalid", exhausted: "statusExhausted" }[credential.status] || "statusReady");
            const up = document.createElement("button");
            up.type = "button"; up.textContent = "↑"; up.title = t("moveUp"); up.disabled = busy || index === 0;
            up.setAttribute("aria-label", `${credential.label}: ${t("moveUp")}`);
            up.addEventListener("click", () => void moveCredential(credential.id, "up"));
            const down = document.createElement("button");
            down.type = "button"; down.textContent = "↓"; down.title = t("moveDown"); down.disabled = busy || index === credentials.length - 1;
            down.setAttribute("aria-label", `${credential.label}: ${t("moveDown")}`);
            down.addEventListener("click", () => void moveCredential(credential.id, "down"));
            const remove = document.createElement("button");
            remove.type = "button"; remove.className = "danger"; remove.textContent = t("remove"); remove.disabled = busy;
            remove.setAttribute("aria-label", `${credential.label}: ${t("remove")}`);
            remove.addEventListener("click", () => void removeCredential(credential.id));
            actions.append(state, up, down, remove);
            item.append(fields, enabled, actions);
            credentialList.appendChild(item);
          });
        }
        function render(next) {
          if (!next) return;
          snapshot = next;
          badge.dataset.state = next.credentialConfigured ? "configured" : "missing";
          badge.textContent = next.credentialConfigured
            ? t("configured").replace("{enabled}", String(next.enabledCredentialCount || 0)).replace("{total}", String(next.credentials?.length || 0))
            : t("missing");
          renderCredentials(next.credentials);
          nativeBadge.dataset.state = next.nativeReady ? "configured" : "missing";
          nativeBadge.textContent = next.nativeReady ? t("nativeReady") : t("nativeMissing");
          if (!busy) {
            document.getElementById("deleteKeys").disabled = !next.credentialConfigured;
            document.getElementById("testConnection").disabled = next.enabledCredentialCount < 1;
            document.getElementById("refreshModels").disabled = next.enabledCredentialCount < 1;
            document.getElementById("saveModel").disabled = next.enabledCredentialCount < 1 || modelList.length === 0;
            document.getElementById("addKey").disabled = next.credentials?.length >= 8;
          }
        }
        function renderModels(models, selected) {
          modelList = Array.isArray(models) ? models : [];
          modelInput.replaceChildren();
          if (!modelList.length) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = snapshot?.enabledCredentialCount > 0 ? t("noModels") : t("configureFirst");
            modelInput.appendChild(option);
          } else {
            for (const model of modelList) {
              const option = document.createElement("option");
              option.value = model.id;
              option.textContent = model.id;
              modelInput.appendChild(option);
            }
            modelInput.value = modelList.some((model) => model.id === selected) ? selected : modelList[0].id;
          }
          modelInput.disabled = busy || modelList.length === 0;
          if (snapshot) render(snapshot);
        }
        async function refreshModels(force = true) {
          const result = await callTool(TOOL.models, { force }, LONG_TOOL_TIMEOUT_MS);
          const toolFailure = failure(result);
          if (toolFailure) throw toolFailure;
          const next = structured(result);
          if (!next || !Array.isArray(next.models)) throw new Error(t("failed"));
          renderModels(next.models, next.selectedModel || snapshot?.model || "");
          return next;
        }
        async function action(progressKey, successKey, operation) {
          setBusy(true);
          setStatus(t(progressKey), "", progressKey);
          try {
            const result = await operation();
            const toolFailure = failure(result);
            if (toolFailure) throw toolFailure;
            const next = structured(result);
            if (next && typeof next.credentialConfigured === "boolean") render(next);
            setStatus(t(successKey), "success", successKey);
            return result;
          } catch (error) {
            if (error?.code === "BRIDGE_TIMEOUT") {
              try {
                const reconciled = await callTool(TOOL.read, {}, 15000);
                const reconciledFailure = failure(reconciled);
                if (!reconciledFailure) render(structured(reconciled));
              } catch {}
            }
            setStatus(localizedError(error), "error");
            return null;
          }
          finally { setBusy(false); }
        }
        async function refreshAfterPersisted(partialFailureKey) {
          setBusy(true);
          setStatus(t("refreshing"), "", "refreshing");
          try {
            await refreshModels(true);
            setStatus(t("refreshed"), "success", "refreshed");
          } catch {
            setStatus(t(partialFailureKey), "error", partialFailureKey);
          } finally { setBusy(false); }
        }
        function validBaseUrl(value) {
          try {
            const parsed = new URL(value);
            const hostname = parsed.hostname.replace(/^\[|\]$/g, "").toLowerCase();
            return ["http:", "https:"].includes(parsed.protocol) && !parsed.username && !parsed.password && !parsed.search && !parsed.hash &&
              (parsed.protocol !== "http:" || ["127.0.0.1", "localhost", "::1"].includes(hostname));
          } catch { return false; }
        }
        async function updateCredential(id, label, baseUrl, enabled, refreshAfterUpdate) {
          const persisted = await action("updatingKey", "keyUpdated", () => callTool(TOOL.updateKey, {
            expectedRevision: snapshot?.revision || 0, id, label, baseUrl, enabled,
          }, 30000));
          const next = structured(persisted);
          if (next && !next.model) renderModels([], "");
          if (persisted && refreshAfterUpdate && next?.enabledCredentialCount > 0) {
            await refreshAfterPersisted("connectionSavedRefreshFailed");
          }
          return persisted;
        }
        function moveCredential(id, direction) {
          return action("movingKey", "keyMoved", () => callTool(TOOL.moveKey, {
            expectedRevision: snapshot?.revision || 0, id, direction,
          }, 30000));
        }
        function removeCredential(id) {
          const credential = snapshot?.credentials?.find((candidate) => candidate.id === id);
          if (!credential || !window.confirm(t("removeConfirm").replace("{label}", credential.label))) return;
          return action("removingKey", "keyRemoved", async () => {
            const result = await callTool(TOOL.removeKey, { expectedRevision: snapshot?.revision || 0, id }, 30000);
            const failed = failure(result); if (failed) throw failed;
            const next = structured(result);
            if (next?.enabledCredentialCount < 1) renderModels([], "");
            return result;
          });
        }
        async function load() {
          setBusy(true);
          setStatus(t("loading"), "", "loading");
          try {
            const result = await callTool(TOOL.read);
            const toolFailure = failure(result);
            if (toolFailure) throw toolFailure;
            const next = structured(result);
            if (!next || typeof next.credentialConfigured !== "boolean" || !Array.isArray(next.credentials) || typeof next.model !== "string" ||
                next.credentials.some((credential) => typeof credential?.baseUrl !== "string")) throw new Error(t("failed"));
            render(next);
            if (next.enabledCredentialCount > 0) await refreshModels(false);
            else renderModels([], "");
            setStatus(t("ready"), "success", "ready");
          } catch (error) { setStatus(localizedError(error), "error"); }
          finally { setBusy(false); }
        }

        languageInput.addEventListener("change", () => applyLanguage(languageInput.value, true));
        document.getElementById("addKey").addEventListener("click", () => {
          const label = keyLabelInput.value.trim();
          const baseUrl = newBaseUrlInput.value.trim();
          const apiKey = keyInput.value.trim();
          if (!label) { setStatus(t("invalidLabel"), "error", "invalidLabel"); return; }
          if (!validBaseUrl(baseUrl)) { setStatus(t("invalidBaseUrl"), "error", "invalidBaseUrl"); return; }
          if (apiKey.length < 8) { setStatus(t("invalidKey"), "error", "invalidKey"); return; }
          void (async () => {
            const persisted = await action("addingKey", "keyAdded", async () => {
              const result = await callTool(TOOL.addKey, { expectedRevision: snapshot?.revision || 0, label, baseUrl, apiKey }, 30000);
              const failed = failure(result); if (failed) throw failed;
              keyLabelInput.value = "";
              keyInput.value = "";
              return result;
            });
            if (persisted && structured(persisted)?.enabledCredentialCount > 0) await refreshAfterPersisted("keyAddedRefreshFailed");
          })();
        });
        document.getElementById("deleteKeys").addEventListener("click", () => {
          if (!window.confirm(t("deleteAllConfirm"))) return;
          void action("deleting", "deleted", async () => {
            const result = await callTool(TOOL.deleteKeys, { expectedRevision: snapshot?.revision || 0 });
            const failed = failure(result); if (failed) throw failed;
            renderModels([], "");
            return result;
          });
        });
        document.getElementById("refreshModels").addEventListener("click", () => void action("refreshing", "refreshed", () => refreshModels(true)));
        document.getElementById("testConnection").addEventListener("click", () => {
          if (!modelInput.value) { setStatus(t("selectModel"), "error", "selectModel"); return; }
          void action("testing", "tested", () => callTool(TOOL.test, { model: modelInput.value }, LONG_TOOL_TIMEOUT_MS));
        });
        document.getElementById("saveModel").addEventListener("click", () => {
          if (!modelInput.value) { setStatus(t("selectModel"), "error", "selectModel"); return; }
          void action("savingModel", "modelSaved", () => callTool(TOOL.save, { expectedRevision: snapshot?.revision || 0, model: modelInput.value }, LONG_TOOL_TIMEOUT_MS));
        });
        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (message.method === "ui/notifications/host-context-changed") { applyHostContext(message.params); return; }
          if (!Object.prototype.hasOwnProperty.call(message, "id")) return;
          const request = pending.get(message.id);
          if (!request) return;
          pending.delete(message.id);
          window.clearTimeout(request.timeout);
          if (message.error) { const error = new Error(message.error.message || t("failed")); error.code = message.error.code; request.reject(error); }
          else request.resolve(message.result);
        });
        applyLanguage(language);
        void load();
      })();
    </script>
  </body>
</html>
