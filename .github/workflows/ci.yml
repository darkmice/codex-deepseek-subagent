name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:all
      - run: find plugins scripts tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: git diff --check
      - run: npm run package
      - run: npm run verify:package
